name: Collect recruitment candidates

on:
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - name: Open review pull request when candidates exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/candidates/; then exit 0; fi
          branch="scrape/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/candidates/
          git commit -m "data: collect recruitment candidates"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "审核自动抓取的招聘信息" --body "自动抓取结果仅为待审核候选项。请核对专业相关性、时间、地点和原始来源后再合并。"
